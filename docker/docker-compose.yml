services:
  # Backend - Locust Swarm Engine
  lc-ews-swarm-engine:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
      target: backend
    container_name: lc-ews-swarm-engine
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ../swarm_engine:/app              # Hot reload backend code
    networks:
      - lc-ews-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/swarms/stats"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Frontend - React with Vite
  lc-ews-frontend:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
      target: frontend
    container_name: lc-ews-frontend
    ports:
      - "5173:5173"      # Primary port
      - "5174:5174"      # Fallback port if 5173 in use
    environment:
      - VITE_HOST=0.0.0.0
      - VITE_API_URL=http://localhost:8001
    volumes:
      - ../src:/app/src                   # Hot reload source code
      - ../public:/app/public             # Hot reload static files
      - /app/node_modules                 # Persist node_modules in container
    networks:
      - lc-ews-network
    depends_on:
      lc-ews-swarm-engine:
        condition: service_healthy
    restart: unless-stopped


networks:
  lc-ews-network:
    driver: bridge

