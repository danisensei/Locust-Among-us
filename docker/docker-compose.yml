services:
  # Frontend - React with Vite
  lc-ews-frontend:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
    container_name: lc-ews-frontend
    ports:
      - "5173:5173"      # Primary port
      - "5174:5174"      # Fallback port if 5173 in use
    environment:
      - VITE_HOST=0.0.0.0
      - VITE_SWARM_API_URL=${VITE_SWARM_API_URL}
    volumes:
      - ../src:/app/src                   # Hot reload source code
      - ../public:/app/public             # Hot reload static files
      - /app/node_modules                 # Persist node_modules in container
    networks:
      - lc-ews-network
    restart: unless-stopped


networks:
  lc-ews-network:
    driver: bridge

