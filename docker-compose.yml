version: '3.8'

services:
  swarm-engine:
    build: ./swarm_engine
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./swarm_engine:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "5175:5175"
    depends_on:
      - swarm-engine
    environment:
      - VITE_API_URL=http://localhost:8000
    restart: unless-stopped

volumes:
  swarm_data:
