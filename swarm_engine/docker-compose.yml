services:

  # ── PostgreSQL + PostGIS ─────────────────────────────────────
  db:
    image: postgis/postgis:15-3.3
    container_name: lc-ews-db
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_USER:     lcews
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB:       lcews
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db_setup.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lcews -d lcews"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Swarm Engine ─────────────────────────────────────
  swarm-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lc-ews-swarm-engine
    env_file:
      - ../.env
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://lcews:${DB_PASSWORD:-changeme}@db:5432/lcews
      - SECRET_KEY=${SECRET_KEY:-CHANGE_ME_IN_PRODUCTION}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Vite Frontend (nginx) ───────────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: swarm_engine/docker_frontend/Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8001}
        VITE_SWARM_API_URL: ${VITE_SWARM_API_URL:-http://localhost:8001}
    container_name: lc-ews-frontend
    ports:
      - "3000:80"
    depends_on:
      swarm-engine:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:

networks:
  default:
    driver: bridge
