version: '3.8'

services:
  swarm-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lc-ews-swarm-engine
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/swarms/stats"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  default:
    driver: bridge
